name: Compiler l'add-in

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compiler
        run: dotnet build RevitExcelLink.csproj -c Release -p:SkipDeploy=true

      - name: Préparer le dossier à copier dans Addins\2025
        shell: pwsh
        run: |
          $out = "package\2025"
          New-Item -ItemType Directory -Force "$out\RevitExcelLink" | Out-Null
          Copy-Item RevitExcelLink.addin $out
          Copy-Item bin\Release\*.dll "$out\RevitExcelLink"
          Copy-Item bin\Release\*.deps.json "$out\RevitExcelLink"
          Get-ChildItem -Recurse $out | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: RevitExcelLink-Addins-2025
          path: package/2025

      - name: Publier le paquet dans la branche dist
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          Compress-Archive -Path package\2025\* -DestinationPath RevitExcelLink-a-copier.zip -Force
          git checkout --orphan dist
          git rm -rf --cached . | Out-Null
          git add -f RevitExcelLink-a-copier.zip
          git commit -m "Paquet compilé ($env:GITHUB_SHA)"
          git push -f origin dist
