name: Compiler l'add-in

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compiler
        run: dotnet build RevitExcelLink.csproj -c Release -p:SkipDeploy=true

      - name: Signer la DLL (certificat Helora BIM)
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX) { Write-Host "Aucun certificat configuré : DLL non signée."; exit 0 }
          $bytes = [Convert]::FromBase64String($env:SIGNING_PFX)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($bytes, $env:SIGNING_PASSWORD, 'Exportable')
          $dll = "bin\Release\RevitExcelLink.dll"
          $r = Set-AuthenticodeSignature -FilePath $dll -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" -ErrorAction SilentlyContinue
          if (-not $r -or -not $r.SignerCertificate) {
            Write-Host "Horodatage indisponible : signature sans horodatage."
            $r = Set-AuthenticodeSignature -FilePath $dll -Certificate $cert -HashAlgorithm SHA256
          }
          Write-Host "Signataire : $($r.SignerCertificate.Subject)  (statut : $($r.Status))"

      - name: Préparer le dossier à copier dans Addins\2025
        shell: pwsh
        run: |
          $out = "package\2025"
          New-Item -ItemType Directory -Force "$out\RevitExcelLink" | Out-Null
          Copy-Item RevitExcelLink.addin $out
          Copy-Item bin\Release\*.dll "$out\RevitExcelLink"
          Copy-Item bin\Release\*.deps.json "$out\RevitExcelLink"
          New-Item -ItemType Directory -Force "$out\RevitExcelLink\Certificat" | Out-Null
          Copy-Item Signing\* "$out\RevitExcelLink\Certificat"
          Get-ChildItem -Recurse $out | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: RevitExcelLink-Addins-2025
          path: package/2025

      - name: Publier le paquet dans la branche dist
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          Compress-Archive -Path package\2025\* -DestinationPath RevitExcelLink-a-copier.zip -Force
          git checkout --orphan dist
          git rm -rf --cached . | Out-Null
          git add -f RevitExcelLink-a-copier.zip
          git commit -m "Paquet compilé ($env:GITHUB_SHA)"
          git push -f origin dist
